<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning GHE – Choisir le mois</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-image: url('Image/Fond/Fond.PNG');
      background-size: 300px auto;
      background-repeat: repeat;
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      padding: 0;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .btn-retour {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.5);
      border: 2px solid rgba(26,58,107,0.3);
      border-radius: 30px;
      padding: 8px 18px;
      color: #1a3a6b;
      font-weight: 900;
      font-size: 0.95rem;
      text-decoration: none;
      margin-bottom: 20px;
    }
    .btn-retour:active { background: rgba(255,255,255,0.8); }

    .titre-page {
      text-align: center;
      margin-bottom: 24px;
    }
    .titre-page h1 {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      color: #1a3a6b;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
    }
    .titre-page p {
      font-size: 0.9rem;
      color: #3a5a3a;
      font-weight: 700;
      margin-top: 4px;
    }

    .mois-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .carte-mois {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      cursor: pointer;
      text-decoration: none;
      display: block;
      border: 3px solid rgba(255,255,255,0.5);
    }
    .carte-mois:active { transform: scale(0.97); }
    .carte-mois img { width: 100%; height: auto; display: block; }

    .chargement { text-align: center; padding: 40px 20px; color: #1a3a6b; font-size: 1.1rem; font-weight: 700; }
    .erreur { background: rgba(255,220,220,0.8); border-radius: 12px; padding: 20px; text-align: center; color: #8a0000; font-weight: 700; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="page">
    <a href="index.html" class="btn-retour">← Retour</a>
    <div class="titre-page">
      <h1 id="titre-type">Planning</h1>
      <p id="sous-titre">Choisissez votre mois</p>
    </div>
    <div class="mois-container" id="mois-container">
      <div class="chargement">⏳ Chargement...</div>
    </div>
  </div>

  <script>
    // Noms des mois SANS accents = noms des fichiers dans Image/mois/
    const NOMS_MOIS_FICHIER = [
      'Janvier','Fevrier','Mars','Avril','Mai','Juin',
      'Juillet','Aout','Septembre','Octobre','Novembre','Decembre'
    ];

    // Noms affichés avec accents
    const NOMS_MOIS_AFFICHE = [
      'Janvier','Février','Mars','Avril','Mai','Juin',
      'Juillet','Août','Septembre','Octobre','Novembre','Décembre'
    ];

    const TITRES = {
      'jour':         'Planning Jour ☀️',
      'nuit':         'Planning Nuit 🌙',
      'stagiaires':   'Planning Stagiaires 🎓',
      'chefs':        'Planning Chefs d\'équipe 👥',
      'pdf':          'Capture & Imprimer 🖨️',
      'ics':          'Ajouter à mon agenda 📅',
      'collectif-ics':'Import Manuel (.ICS) 📥'
    };

    const params = new URLSearchParams(window.location.search);
    const type = params.get('type') || 'jour';
    document.getElementById('titre-type').textContent = TITRES[type] || 'Planning';

    function getMoisAAfficher() {
      const now = new Date();
      const jour = now.getDate();
      const moisIndex = now.getMonth();
      const annee = now.getFullYear();
      const mois = [{ moisIndex, annee }];
      if (jour >= 20) {
        let m = moisIndex + 1, a = annee;
        if (m > 11) { m = 0; a++; }
        mois.push({ moisIndex: m, annee: a });
      }
      return mois;
    }

    function formatCle(moisIndex, annee) {
      return `${String(moisIndex + 1).padStart(2, '0')}.${annee}`;
    }

    // Image : Image/mois/Juin.jpeg (sans année, sans accent)
    function nomImage(moisIndex) {
      return `Image/mois/${NOMS_MOIS_FICHIER[moisIndex]}.jpeg`;
    }

    async function charger() {
      const container = document.getElementById('mois-container');
      try {
        const response = await fetch('liens-a-modifier.json');
        const liens = await response.json();
        const moisAAfficher = getMoisAAfficher();
        container.innerHTML = '';

        for (const { moisIndex, annee } of moisAAfficher) {
          const cle = formatCle(moisIndex, annee);
          const lien = liens[type] && liens[type][cle];

          if (!lien) {
            container.innerHTML += `<div class="erreur">⚠️ Lien non trouvé pour ${NOMS_MOIS_AFFICHE[moisIndex]} ${annee}</div>`;
            continue;
          }

          const carte = document.createElement('a');
          carte.href = lien;
          carte.target = '_blank';
          carte.className = 'carte-mois';
          carte.innerHTML = `<img src="${nomImage(moisIndex)}" alt="${NOMS_MOIS_AFFICHE[moisIndex]} ${annee}" loading="lazy">`;
          container.appendChild(carte);
        }

      } catch (err) {
        container.innerHTML = `<div class="erreur">❌ Erreur de chargement. Vérifiez votre connexion.</div>`;
        console.error(err);
      }
    }

    charger();
  </script>
</body>
</html>
