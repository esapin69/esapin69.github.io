<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Planning GHE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      background: #c8aa80;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Image qui prend TOUTE la largeur */
    .image-fond {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Zones cliquables par-dessus */
    .zones {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }

    .zone {
      position: absolute;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(255,255,255,0.2);
      border-radius: 14px;
    }

    .zone:active {
      background: rgba(255,255,255,0.15);
    }

    /* JOUR */
    .z-jour       { left:3%;   top:21%;  width:44%; height:15.5%; }
    /* NUIT */
    .z-nuit       { left:52%;  top:21%;  width:44%; height:15.5%; }
    /* STAGIAIRES */
    .z-stagiaires { left:3%;   top:38%;  width:44%; height:12%; }
    /* CHEFS D'EQUIPE */
    .z-chefs      { left:52%;  top:38%;  width:44%; height:12%; }
    /* CAPTURE & IMPRIMER */
    .z-capture    { left:3%;   top:54%;  width:44%; height:7%; }
    /* AJOUTER AGENDA */
    .z-agenda     { left:52%;  top:54%;  width:44%; height:7%; }
    /* iOS */
    .z-ios        { left:3%;   top:65%;  width:41%; height:6%; }
    /* ANDROID */
    .z-android    { left:52%;  top:65%;  width:41%; height:6%; }
    /* IMPORT ICS */
    .z-ics        { left:3%;   top:73%;  width:93%; height:6%; }
    /* MUR DE L'EQUIPE */
    .z-mur        { left:3%;   top:82%;  width:56%; height:5%; }
    /* DEMANDER UN CHANGEMENT (bouton rouge rond) */
    .z-changement { left:66%;  top:88%;  width:30%; height:10%; border-radius: 50%; }
  </style>
</head>
<body>
  <div class="container">
    <img class="image-fond" 
         src="images/accueil.PNG" 
         alt="Planning GHE"
         onload="ajusterZones(this)">

    <div class="zones" id="zones">
      <a class="zone z-jour"       href="mois.html?type=jour"></a>
      <a class="zone z-nuit"       href="mois.html?type=nuit"></a>
      <a class="zone z-stagiaires" href="mois.html?type=stagiaires"></a>
      <a class="zone z-chefs"      href="mois.html?type=chefs"></a>
      <a class="zone z-capture"    href="mois.html?type=pdf"></a>
      <a class="zone z-agenda"     href="mois.html?type=ics"></a>
      <a class="zone z-ios"        href="webcal://calendar.google.com/calendar/ical/ca4fd5e66513b5e783fba86f6df8e1f73dbd237fc1f83749f3cabb97d273d969%40group.calendar.google.com/private-5a1892e376d3c9b3cc82c5f0ad61c333/basic.ics"></a>
      <a class="zone z-android"    href="https://calendar.google.com/calendar/render?cid=https%3A%2F%2Fcalendar.google.com"></a>
      <a class="zone z-ics"        href="mois.html?type=collectif-ics"></a>
      <a class="zone z-mur"        href="https://drive.google.com/drive/folders/1jhmY4Kw-v3-E5WMus77Q73Vghwk5-Cpd" target="_blank"></a>
      <a class="zone z-changement" href="https://drive.google.com/drive/folders/1XI4-1avrFkj5fLUMF5vgLfPtTaH40AXt" target="_blank"></a>
    </div>
  </div>

  <script>
    function ajusterZones(img) {
      // Les zones sont en % donc elles s'adaptent automatiquement
      console.log("Image chargée:", img.naturalWidth, "x", img.naturalHeight);
    }
  </script>
</body>
</html>
