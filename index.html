<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning GHE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      background-image: url('Image/Fond/Fond.PNG');
      background-size: 300px auto;
      background-repeat: repeat;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bloc {
      width: 100%;
      /* Suppression du fond blanc + bordure arrondie sans clip */
      background: transparent;
      position: relative;
    }

    .bloc img {
      width: 100%;
      height: auto;
      display: block;
      /* Pas de border-radius ici pour ne pas clipper le fond blanc des JPEG */
    }

    .zone {
      position: absolute;
      cursor: pointer;
      border-radius: 10px;
      -webkit-tap-highlight-color: rgba(255,255,255,0.2);
    }
    .zone:active { background: rgba(255,255,255,0.15); }

    a { text-decoration: none; }
  </style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="bloc">
    <img src="Image/Bloc/bloc_planning.jpeg" alt="Planning GHE brancardier" loading="eager">
  </div>

  <!-- PLANNING OFFICIEL : JOUR / NUIT / STAGIAIRES / CHEFS -->
  <div class="bloc">
    <img src="Image/Bloc/bloc_jour.jpeg" alt="Planning officiel" loading="eager">
    <a class="zone" href="mois.html?type=jour"       style="top:24%;left:2%;width:46%;height:34%;"></a>
    <a class="zone" href="mois.html?type=nuit"       style="top:24%;right:2%;width:46%;height:34%;"></a>
    <a class="zone" href="mois.html?type=stagiaires" style="top:60%;left:2%;width:46%;height:34%;"></a>
    <a class="zone" href="mois.html?type=chefs"      style="top:60%;right:2%;width:46%;height:34%;"></a>
  </div>

  <!-- MON PLANNING PERSONNEL : CAPTURE / AGENDA -->
  <div class="bloc">
    <img src="Image/Bloc/bloc_agenda.jpeg" alt="Mon planning personnel" loading="lazy">
    <a class="zone" href="mois.html?type=pdf" style="top:20%;left:2%;width:46%;height:76%;"></a>
    <a class="zone" href="mois.html?type=ics" style="top:20%;right:2%;width:46%;height:76%;"></a>
  </div>

  <!-- INFOS ÉQUIPE DU JOUR : iOS / ANDROID / ICS -->
  <div class="bloc">
    <img src="Image/Bloc/bloc_infos.jpeg" alt="Infos équipe du jour" loading="lazy">
    <a class="zone"
       href="webcal://calendar.google.com/calendar/ical/ca4fd5e66513b5e783fba86f6df8e1f73dbd237fc1f83749f3cabb97d273d969%40group.calendar.google.com/private-5a1892e376d3c9b3cc82c5f0ad61c333/basic.ics"
       style="top:20%;left:2%;width:46%;height:32%;"></a>
    <a class="zone"
       href="https://calendar.google.com/calendar/render?cid=https%3A%2F%2Fcalendar.google.com%2Fcalendar%2Fical%2Fca4fd5e66513b5e783fba86f6df8e1f73dbd237fc1f83749f3cabb97d273d969%2540group.calendar.google.com%2Fprivate-5a1892e376d3c9b3cc82c5f0ad61c333%2Fbasic.ics"
       style="top:20%;right:2%;width:46%;height:32%;"></a>
    <a class="zone" href="mois.html?type=collectif-ics"
       style="top:57%;left:3%;width:94%;height:35%;"></a>
  </div>

  <!-- DEMANDER UN CHANGEMENT -->
  <div class="bloc">
    <img src="Image/Bloc/bloc_demande.jpeg" alt="Demander un changement" loading="lazy">
    <a class="zone"
       href="https://drive.google.com/drive/folders/1XI4-1avrFkj5fLUMF5vgLfPtTaH40AXt"
       target="_blank"
       style="top:28%;left:22%;width:56%;height:65%;border-radius:50%;"></a>
  </div>

</div>
</body>
</html>
