<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning GHE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      background-image: url('images/Fond du site _ couleur.PNG');
      background-size: 300px auto;
      background-repeat: repeat;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bloc {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      position: relative;
    }

    .bloc img {
      width: 100%;
      height: auto;
      display: block;
    }

    .zone {
      position: absolute;
      cursor: pointer;
      border-radius: 10px;
      -webkit-tap-highlight-color: rgba(255,255,255,0.2);
    }
    .zone:active { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
<div class="page">
